services:
  waf:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      WAF_SECRET_KEY: ${WAF_SECRET_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PROXY_HTTP_ADDR: :8080
      PROXY_HTTPS_ADDR: ${PROXY_HTTPS_ADDR:-}
      ADMIN_ADDR: :9000
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      FAIL_OPEN_ON_INFRA_ERROR: ${FAIL_OPEN_ON_INFRA_ERROR:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      # Public traffic to protected sites -- this is meant to face the internet.
      - "${PROXY_HTTP_PORT:-80}:8080"
      # HTTPS is only actually served once TLS_CERT_FILE/TLS_KEY_FILE and
      # PROXY_HTTPS_ADDR are set; harmless to publish otherwise.
      - "${PROXY_HTTPS_PORT:-443}:8443"
      # Admin dashboard: bound to localhost ONLY by default. Do not widen
      # this to 0.0.0.0 without putting authentication-aware TLS (a
      # reverse proxy, VPN, or SSH tunnel) in front -- see the README's
      # "Securing the admin panel" section before exposing this remotely.
      - "127.0.0.1:${ADMIN_PORT:-9000}:9000"
    volumes:
      - ./certs:/certs:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [wafnet]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [wafnet]
    # No ports published: only the waf service on the internal network can
    # reach Postgres. Uncomment to allow host access for debugging:
    # ports: ["127.0.0.1:5432:5432"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [wafnet]
    # No ports published, same reasoning as postgres above.

networks:
  wafnet:
    driver: bridge

volumes:
  pgdata:
  redisdata:
